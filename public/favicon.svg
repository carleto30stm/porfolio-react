<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbff00"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0a0a0f"/>

  <!-- Subtle inner gradient overlay -->
  <rect width="32" height="32" rx="7" fill="url(#grad)" opacity="0.07"/>

  <!-- Border glow -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25"
        stroke="url(#grad)" stroke-width="1" opacity="0.5"/>

  <!-- < bracket -->
  <polyline points="8,10 4,16 8,22" stroke="url(#grad)" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- > bracket -->
  <polyline points="24,10 28,16 24,22" stroke="url(#grad)" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- / slash — inclined like a lightning bolt (rock ⚡ + code) -->
  <line x1="19" y1="9" x2="13" y2="23" stroke="url(#grad)" stroke-width="2.4"
        stroke-linecap="round" filter="url(#glow)"/>
</svg>
